[project]
name = "dojo"
version = "0.1.0"
description = "AI-guided interview prep: a never-solve tutor, an empirical complexity grader, and a qualitative code reviewer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "debugpy>=1.8.21",
    "ipykernel>=7.3.0",
    "openai>=3.8.0",
    "prompt-toolkit>=3.0.53",
    "radon>=6.0.1",
    "rich>=15.0.0",
    "ruff>=0.16.6",
]

[project.scripts]
dojo = "dojo.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = true
